<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nexora OS — écran de démarrage</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background: #090c16; color: #edf0ff; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 36%, #141a31 0, #090c16 58%); }
    main { width: min(100%, 820px); padding: 28px; text-align: center; }
    img { width: min(100%, 720px); height: auto; display: block; margin-inline: auto; }
    p { margin: 16px 0 0; color: #8290b2; font-size: .85rem; letter-spacing: .04em; }
    @media (prefers-reduced-motion: reduce) { img { opacity: .94; } }
  </style>
</head>
<body>
  <main>
    <img src="boot-pulse.svg" alt="Écran de démarrage Nexora OS, avec un hexagone violet et cyan et une étoile qui pulse doucement">
    <p>Aperçu visuel de l’identité Nexora — animation SVG en boucle.</p>
  </main>
</body>
</html>
