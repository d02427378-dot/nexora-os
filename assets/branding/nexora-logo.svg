<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Nexora OS</title>
  <desc id="desc">Logo Nexora OS : hexagone néon violet/cyan et étoile à quatre branches au centre sur fond bleu-noir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0e19"/><stop offset="1" stop-color="#101629"/>
    </linearGradient>
    <linearGradient id="edge" x1="42" y1="36" x2="230" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ad70ff"/><stop offset=".5" stop-color="#7771ff"/><stop offset="1" stop-color="#41e7ff"/>
    </linearGradient>
    <linearGradient id="word" x1="296" y1="78" x2="623" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2f3ff"/><stop offset="1" stop-color="#a8c9ff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="44%" r="60%">
      <stop stop-color="#18223d"/><stop offset="1" stop-color="#0a0d18"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/><feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="starglow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="260" rx="28" fill="url(#bg)"/>
  <path d="M136 18 235 75v114l-99 57-99-57V75l99-57Z" fill="url(#edge)" opacity=".2" filter="url(#glow)"/>
  <path d="M136 27 227 79v106l-91 53-91-53V79l91-52Z" fill="url(#core)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M136 48 208 89v86l-72 42-72-42V89l72-41Z" fill="none" stroke="url(#edge)" stroke-opacity=".32" stroke-width="1.5"/>
  <path d="m136 80 12 38 42 18-42 16-12 39-12-39-42-16 42-18 12-38Z" fill="#dffcff" filter="url(#starglow)"/>
  <path d="m136 89 9 35 35 12-35 13-9 34-9-34-35-13 35-12 9-35Z" fill="url(#edge)"/>
  <circle cx="136" cy="136" r="5" fill="#fff"/>
  <text x="290" y="133" fill="url(#word)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="1.5">NEXORA</text>
  <text x="296" y="181" fill="#7f91b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="8">OPERATING SYSTEM</text>
  <path d="M296 201h285" stroke="url(#edge)" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
</svg>
